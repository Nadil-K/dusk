[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dusk-deprecation"
version = "0.1.0"
description = "RFC 8594-compliant API deprecation middleware with pluggable storage"
readme = "../../README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["api", "deprecation", "sunset", "middleware", "rfc8594"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
  "pyyaml>=6.0",
  "click>=8.0",
  "aiosqlite>=0.20",
]

[project.optional-dependencies]
fastapi   = ["starlette>=0.37"]
redis     = ["redis[asyncio]>=5.0"]
dashboard = ["fastapi>=0.110", "uvicorn>=0.29"]
all       = ["dusk-deprecation[fastapi,redis,dashboard]"]
dev       = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "fastapi>=0.110",
  "starlette>=0.37",
]

[project.scripts]
dusk = "dusk.cli.main:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/dusk"]
