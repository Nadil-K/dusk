name: CI | Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'packages/go/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/go/go.mod

      - name: Run tests
        run: go test ./...
        working-directory: packages/go
